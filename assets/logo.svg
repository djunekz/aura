<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="744" viewBox="0 0 1024 744" role="img" aria-labelledby="aura-title aura-desc">
  <title id="aura-title">AURA</title>
  <desc id="aura-desc">The AURA interactive shell showing its banner and the main command menu: System, Memory, Git, Runner, Watcher, Network, AI, Plugins, Marketplace, World, Scheduler, Logs, Config and History.</desc>
  <defs>
    <linearGradient id="aura-grad" gradientUnits="userSpaceOnUse" x1="52" y1="52" x2="972" y2="692">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="flame-outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.55" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <clipPath id="window-clip">
      <rect x="52" y="52" width="920" height="640" rx="16"/>
    </clipPath>
  </defs>

  <rect x="47" y="47" width="930" height="650" rx="21" fill="none" stroke="url(#aura-grad)" stroke-width="6" stroke-opacity="0.246"/>
  <rect x="42" y="42" width="940" height="660" rx="26" fill="none" stroke="url(#aura-grad)" stroke-width="6" stroke-opacity="0.196"/>
  <rect x="37" y="37" width="950" height="670" rx="31" fill="none" stroke="url(#aura-grad)" stroke-width="6" stroke-opacity="0.151"/>
  <rect x="32" y="32" width="960" height="680" rx="36" fill="none" stroke="url(#aura-grad)" stroke-width="6" stroke-opacity="0.110"/>
  <rect x="27" y="27" width="970" height="690" rx="41" fill="none" stroke="url(#aura-grad)" stroke-width="6" stroke-opacity="0.076"/>
  <rect x="22" y="22" width="980" height="700" rx="46" fill="none" stroke="url(#aura-grad)" stroke-width="6" stroke-opacity="0.046"/>
  <rect x="17" y="17" width="990" height="710" rx="51" fill="none" stroke="url(#aura-grad)" stroke-width="6" stroke-opacity="0.023"/>
  <rect x="12" y="12" width="1000" height="720" rx="56" fill="none" stroke="url(#aura-grad)" stroke-width="6" stroke-opacity="0.007"/>

  <rect x="52" y="52" width="920" height="640" rx="16" fill="#15132b" stroke="url(#aura-grad)" stroke-width="1.5"/>
  <g clip-path="url(#window-clip)">
    <rect x="52" y="52" width="920" height="46" fill="#1e1b40"/>
    <line x1="52" y1="98" x2="972" y2="98" stroke="#403d7a" stroke-width="1"/>
  </g>
  <circle cx="84" cy="75" r="6.5" fill="#ff5f57"/>
  <circle cx="108" cy="75" r="6.5" fill="#febc2e"/>
  <circle cx="132" cy="75" r="6.5" fill="#28c840"/>

  <g font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="15">
    <text x="512" y="80" fill="#8f8cc0" text-anchor="middle">aura</text>

    <g transform="translate(114 160) scale(1.25)">
      <path d="M0,-36 C6,-22 22,-14 24,6 C26,24 14,36 0,36 C-14,36 -26,24 -24,6 C-23,-4 -17,-10 -13,-17 C-11,-9 -7,-5 -3,-4 C-6,-16 -4,-28 0,-36 Z" fill="url(#flame-outer)"/>
      <path d="M0,6 C6,12 11,17 9,24 C7,31 -7,31 -9,24 C-11,16 -5,13 0,6 Z" fill="#fde68a"/>
    </g>
    <text x="164" y="178" fill="#67e8f9" font-size="76" font-weight="800" letter-spacing="12">AURA</text>
    <text x="168" y="210" fill="#a09dcc" font-size="16">Adaptive Unified Runtime Assistant</text>

    <text x="88" y="264" xml:space="preserve"><tspan fill="#4ade80" font-weight="700">aura&gt;</tspan><tspan fill="#e6e5f7"> help</tspan></text>

    <line x1="88" y1="293" x2="112" y2="293" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="122" y="298" fill="#60a5fa" font-weight="700">Available Commands</text>
    <line x1="294" y1="293" x2="634" y2="293" stroke="#60a5fa" stroke-width="1.5"/>

    <text x="88" y="324" fill="#fcd34d" font-weight="700">System:</text>
    <text x="88" y="344" fill="#e6e5f7" xml:space="preserve">  status  context  identity  help  exit</text>
    <text x="88" y="370" fill="#fcd34d" font-weight="700">Memory:</text>
    <text x="88" y="390" fill="#e6e5f7" xml:space="preserve">  memory set|get|delete|clear</text>
    <text x="88" y="416" fill="#fcd34d" font-weight="700">Git:</text>
    <text x="88" y="436" fill="#e6e5f7" xml:space="preserve">  git status|log|add|commit|push|pull|autopush</text>
    <text x="88" y="462" fill="#fcd34d" font-weight="700">Runner:</text>
    <text x="88" y="482" fill="#e6e5f7" xml:space="preserve">  run &lt;cmd&gt;  kill</text>
    <text x="88" y="508" fill="#fcd34d" font-weight="700">Watcher:</text>
    <text x="88" y="528" fill="#e6e5f7" xml:space="preserve">  watch on|off</text>
    <text x="88" y="554" fill="#fcd34d" font-weight="700">Network:</text>
    <text x="88" y="574" fill="#e6e5f7" xml:space="preserve">  network on|off</text>
    <text x="88" y="600" fill="#fcd34d" font-weight="700">AI:</text>
    <text x="88" y="620" fill="#e6e5f7" xml:space="preserve">  ask &lt;question&gt;</text>
    <text x="536" y="324" fill="#fcd34d" font-weight="700">Plugins:</text>
    <text x="536" y="344" fill="#e6e5f7" xml:space="preserve">  plugin list|install|install-url|update</text>
    <text x="536" y="370" fill="#fcd34d" font-weight="700">Marketplace:</text>
    <text x="536" y="390" fill="#e6e5f7" xml:space="preserve">  marketplace list|install</text>
    <text x="536" y="416" fill="#fcd34d" font-weight="700">World:</text>
    <text x="536" y="436" fill="#e6e5f7" xml:space="preserve">  world status|user|project</text>
    <text x="536" y="462" fill="#fcd34d" font-weight="700">Scheduler:</text>
    <text x="536" y="482" fill="#e6e5f7" xml:space="preserve">  scheduler list|add|stop</text>
    <text x="536" y="508" fill="#fcd34d" font-weight="700">Logs:</text>
    <text x="536" y="528" fill="#e6e5f7" xml:space="preserve">  logs [n]  logs clear</text>
    <text x="536" y="554" fill="#fcd34d" font-weight="700">Config:</text>
    <text x="536" y="574" fill="#e6e5f7" xml:space="preserve">  config  config init|set</text>
    <text x="536" y="600" fill="#fcd34d" font-weight="700">History:</text>
    <text x="536" y="620" fill="#e6e5f7" xml:space="preserve">  history</text>

    <text x="88" y="656" fill="#4ade80" font-weight="700">aura&gt;</text>
    <rect x="143" y="642" width="9" height="18" fill="#67e8f9"/>
  </g>
</svg>
