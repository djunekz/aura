name: Bug report
description: Something does not work as documented
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please check the [troubleshooting guide](https://github.com/djunekz/aura/blob/main/docs/troubleshooting.md) and existing issues first.
        Security problems must be reported privately through the security advisory link on the issue chooser.
  - type: input
    id: version
    attributes:
      label: AURA version
      description: Output of `aura --version`
      placeholder: 0.10.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v22.12.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Termux (Android)
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - npm install -g aura-terminal
        - git clone
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands you typed in the AURA shell.
      placeholder: |
        1. aura
        2. git autopush fix
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Paste the output. The `logs 50` command is often useful. Remove tokens and personal data first.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I reproduced this on the latest released version
          required: false
