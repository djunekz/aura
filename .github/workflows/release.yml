name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Validate tag
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $TAG does not match the package.json version $PACKAGE_VERSION"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG does not point to a commit on main"
            exit 1
          fi
          case "$VERSION" in
            *-*)
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "npm_tag=next" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run check

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: node scripts/changelog.js notes "$VERSION" > release-notes.md

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          NPM_TAG: ${{ steps.meta.outputs.npm_tag }}
        run: |
          if npm view "aura-terminal@$VERSION" version > /dev/null 2>&1; then
            echo "aura-terminal@$VERSION is already on npm, skipping publish"
          else
            npm publish --provenance --access public --tag "$NPM_TAG"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Aura $TAG" --notes-file release-notes.md
          elif [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" --title "Aura $TAG" --notes-file release-notes.md --verify-tag --prerelease
          else
            gh release create "$TAG" --title "Aura $TAG" --notes-file release-notes.md --verify-tag
          fi
